version: "3.9"

networks:
  external-network:
    name: external-network
    driver: bridge

services:
  web-alpine:
    build:
      context: .
      dockerfile: dockerfile
      labels:
      - "com.centurylinklabs.watchtower.enable=false"
    command: npm start
    environment:
      - EMAIL_ADDRESS=${EMAIL_ADDRESS}
      - DOMAIN=${BOTDOMAIN}
    ports:
    - 5005:5000
    restart: unless-stopped
    networks:
      - external-network
